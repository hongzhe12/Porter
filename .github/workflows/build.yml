name: Build

on:
  push:
    branches:
      - main
      - master
      - container

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - run: |
          pyinstaller --onefile --windowed --icon icon.ico --name docker_editor main.py

      - uses: actions/upload-artifact@v4
        with:
          name: docker_editor
          path: dist/docker_editor.exe
          retention-days: 7